name: Unzip backend
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP to repo root
        run: |
          unzip -o movie-recap-backend-deploy.zip -d _extract
          echo "--- extracted tree ---"
          find _extract -maxdepth 3 -print
          TOP=$(find _extract -maxdepth 2 -name server.js -print | head -n 1 | xargs dirname)
          echo "TOP=$TOP"
          cp -a "$TOP"/. .
          rm -rf _extract movie-recap-backend-deploy.zip .github/workflows/unzip.yml
          echo "--- root after extract ---"
          ls -la
          find . -maxdepth 2 -not -path './.git*' -print | sort
          test -f server.js
          test -f package.json
          test -f Dockerfile
          test -f render.yaml
          test -d src
          if [ -f .env ]; then echo "ERROR .env present, removing"; rm -f .env; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract backend source from ZIP to repo root" || echo "nothing to commit"
          git push
